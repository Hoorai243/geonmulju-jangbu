<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>건물주 장부</title>
  <meta name="description" content="월세·관리비·보증금 입금 여부를 한눈에 관리하는 건물주용 장부" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1F5FA8" />
  <link rel="icon" href="icons/favicon-64.png" sizes="64x64" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="장부" />
  <meta name="mobile-web-app-capable" content="yes" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="assertive"></div>

  <noscript>
    <div style="padding:24px;font-size:20px;line-height:1.6">
      이 앱을 쓰려면 브라우저에서 자바스크립트를 켜야 해요.
    </div>
  </noscript>

  <!-- 안전장치 — 시작 중 오류가 나면 흰 화면 대신 오류를 보여준다. -->
  <script>
    (function () {
      function show(msg) {
        var el = document.getElementById('app');
        if (!el || el.childElementCount > 0) return; // 이미 화면이 그려졌으면 건드리지 않음
        el.textContent = '';
        var box = document.createElement('div');
        box.setAttribute('style', 'padding:20px;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-all;color:#8a1c1c;font-family:monospace');
        box.textContent = '[앱 오류]\n' + String(msg); // innerHTML 안 씀(오류 문구에 HTML 있어도 안전)
        el.appendChild(box);
      }
      window.addEventListener('error', function (e) {
        show((e.message || e.type) + '\n' + (e.filename || '') + ' : ' + (e.lineno || '') + '\n' + ((e.error && e.error.stack) || ''));
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason; show('promise 오류\n' + ((r && (r.stack || r.message)) || r));
      });
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
